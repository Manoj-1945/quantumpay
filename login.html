<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuantumPay — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#020510;--cyan:#00f5ff;--purple:#7b2fff;--green:#00ffaa;
      --pink:#ff6b6b;--text:#e0eaff;--dim:#8090b0;
      --border:rgba(0,245,255,0.12);--border2:rgba(0,245,255,0.3);
    }
    body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
    canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0.35}
    .wrap{position:relative;z-index:1;width:100%;max-width:420px;padding:24px}
    .logo{text-align:center;margin-bottom:32px}
    .logo-icon{font-size:3rem;display:block;margin-bottom:8px;animation:spin 6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .logo-name{font-size:1.6rem;font-weight:900}
    .logo-name span{background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .logo-sub{font-size:0.78rem;color:var(--dim)}
    .card{background:rgba(10,15,40,0.9);border:1px solid var(--border);border-radius:20px;padding:32px;backdrop-filter:blur(20px);position:relative;overflow:hidden}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,245,255,0.4),transparent)}
    .tabs{display:flex;gap:0;margin-bottom:28px;background:rgba(0,0,0,0.3);border-radius:10px;padding:4px}
    .tab-btn{flex:1;padding:8px;border:none;background:transparent;color:var(--dim);font-family:'Outfit',sans-serif;font-size:0.85rem;font-weight:600;border-radius:8px;cursor:pointer;transition:all 0.2s}
    .tab-btn.active{background:rgba(0,245,255,0.15);color:var(--cyan)}
    .form{display:none;flex-direction:column;gap:16px}
    .form.active{display:flex}
    .field label{display:block;font-size:0.75rem;color:var(--dim);font-weight:600;margin-bottom:6px;letter-spacing:0.3px}
    .field input{width:100%;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:'Outfit',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.2s}
    .field input:focus{border-color:var(--cyan)}
    .field input::placeholder{color:var(--dim)}
    .submit-btn{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#000;font-weight:800;font-size:0.92rem;padding:14px;border-radius:12px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.3s;letter-spacing:0.5px;margin-top:4px}
    .submit-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,245,255,0.35)}
    .submit-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
    .btn-glow{position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(255,255,255,0.2),transparent);transform:translateX(-100%);transition:transform 0.6s}
    .submit-btn:hover .btn-glow{transform:translateX(100%)}
    .security-note{background:rgba(0,245,255,0.06);border:1px solid rgba(0,245,255,0.15);border-radius:10px;padding:10px 12px;font-size:0.72rem;color:var(--dim);display:flex;align-items:center;gap:8px}
    .demo-btns{display:flex;gap:8px;margin-top:4px}
    .demo-btn{flex:1;background:rgba(0,245,255,0.08);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:0.72rem;color:var(--cyan);font-family:'Outfit',sans-serif;cursor:pointer;transition:all 0.2s}
    .demo-btn:hover{background:rgba(0,245,255,0.15)}
    .err{background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.3);border-radius:8px;padding:10px 12px;font-size:0.78rem;color:var(--pink);display:none}
    .err.show{display:block}
    .ok{background:rgba(0,255,170,0.1);border:1px solid rgba(0,255,170,0.3);border-radius:8px;padding:10px 12px;font-size:0.78rem;color:var(--green);display:none}
    .ok.show{display:block}
    .back-link{text-align:center;margin-top:20px;font-size:0.78rem;color:var(--dim)}
    .back-link a{color:var(--cyan);font-weight:600}
    .api-status{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:12px;font-size:0.72rem;color:var(--dim)}
    .api-dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex-shrink:0}
    .api-dot.up{background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2s ease infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="wrap">
    <div class="logo">
      <span class="logo-icon">⚛</span>
      <div class="logo-name"><span>Quantum</span>Pay</div>
      <div class="logo-sub">World's First Quantum-Secured Payments</div>
    </div>
    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login',this)">Sign In</button>
        <button class="tab-btn" onclick="switchTab('register',this)">Create Account</button>
      </div>

      <!-- LOGIN FORM -->
      <form class="form active" id="form-login" onsubmit="doLogin(event)">
        <div class="field"><label>UPI ID</label><input id="l-upi" type="text" placeholder="name@quantumpay" required/></div>
        <div class="field"><label>Password</label><input id="l-pw" type="password" placeholder="Enter password" required/></div>
        <div class="err" id="l-err"></div>
        <div class="security-note">🔐 Login secured with CRYSTALS-Kyber PQC encryption</div>
        <div class="demo-btns">
          <button type="button" class="demo-btn" onclick="fillDemo()">⚡ Use Demo Account</button>
        </div>
        <button class="submit-btn" type="submit" id="l-btn">
          <span class="btn-glow"></span>
          ⚛ Sign In with Quantum Auth
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form class="form" id="form-register" onsubmit="doRegister(event)">
        <div class="field"><label>Full Name</label><input id="r-name" type="text" placeholder="Manoj Kumar" required/></div>
        <div class="field"><label>Email</label><input id="r-email" type="email" placeholder="you@example.com" required/></div>
        <div class="field"><label>UPI ID</label><input id="r-upi" type="text" placeholder="yourname@quantumpay" required/></div>
        <div class="field"><label>Password</label><input id="r-pw" type="password" placeholder="Create strong password" required/></div>
        <div class="err" id="r-err"></div>
        <div class="ok" id="r-ok"></div>
        <div class="security-note">⚛ Your account will be secured with quantum-grade encryption from the moment it's created</div>
        <button class="submit-btn" type="submit" id="r-btn">
          <span class="btn-glow"></span>
          ⚛ Create Quantum Account
        </button>
      </form>
    </div>

    <div class="api-status">
      <div class="api-dot" id="api-dot"></div>
      <span id="api-status-text">Connecting to quantum backend...</span>
    </div>
    <div class="back-link"><a href="index.html">← Back to QuantumPay Home</a></div>
  </div>

  <script>
  const API = '';

  // Canvas particles
  (function(){
    const c=document.getElementById('c'),ctx=c.getContext('2d');
    let ps=[];
    const R=()=>{c.width=window.innerWidth;c.height=window.innerHeight};
    R();window.addEventListener('resize',R);
    class P{constructor(){this.reset()}reset(){this.x=Math.random()*c.width;this.y=Math.random()*c.height;this.vx=(Math.random()-.5)*.4;this.vy=(Math.random()-.5)*.4;this.r=Math.random()*1.5+.5;this.h=Math.random()>.5?190:270;this.a=Math.random()*.3+.1}update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>c.width)this.vx*=-1;if(this.y<0||this.y>c.height)this.vy*=-1}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`hsla(${this.h},100%,70%,${this.a})`;ctx.fill()}}
    for(let i=0;i<60;i++)ps.push(new P());
    (function f(){ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.update();p.draw()});requestAnimationFrame(f)})();
  })();

  // Check backend
  async function checkAPI(){
    try{
      const r=await fetch(`${API}/health`,{signal:AbortSignal.timeout(3000)});
      if(r.ok){
        document.getElementById('api-dot').className='api-dot up';
        document.getElementById('api-status-text').textContent='✅ Quantum backend online — real PQC active';
      }
    }catch{
      document.getElementById('api-status-text').textContent='⚠ Backend offline — start backend/main.py first';
    }
  }
  checkAPI();

  function switchTab(tab,btn){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.form').forEach(f=>f.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('form-'+tab).classList.add('active');
  }

  function fillDemo(){
    document.getElementById('l-upi').value='demo@quantumpay';
    document.getElementById('l-pw').value='Quantum@123';
  }

  async function doLogin(e){
    e.preventDefault();
    const btn=document.getElementById('l-btn');
    const err=document.getElementById('l-err');
    btn.disabled=true;btn.textContent='⚛ Authenticating...';err.className='err';
    try{
      const r=await fetch(`${API}/api/auth/login`,{
        method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({upi_id:document.getElementById('l-upi').value,password:document.getElementById('l-pw').value})
      });
      const data=await r.json();
      if(!r.ok)throw new Error(data.detail||'Login failed');
      // localStorage.setItem('qp_token',data.token);  // Phase 5: Using HttpOnly Cookies
      localStorage.setItem('qp_name',data.name);
      localStorage.setItem('qp_upi',data.upi_id);
      localStorage.setItem('qp_balance',data.balance||10000);
      if (data.is_admin) { window.location.href='admin.html'; } else { window.location.href='pay.html'; }
    }catch(ex){
      err.textContent='❌ '+ex.message;err.className='err show';
      btn.disabled=false;btn.innerHTML='<span class="btn-glow"></span>⚛ Sign In with Quantum Auth';
    }
  }

  async function doRegister(e){
    e.preventDefault();
    const btn=document.getElementById('r-btn');
    const err=document.getElementById('r-err');
    const ok=document.getElementById('r-ok');
    btn.disabled=true;btn.textContent='⚛ Creating account...';
    err.className='err';ok.className='ok';
    try{
      const r=await fetch(`${API}/api/auth/register`,{
        method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          name:document.getElementById('r-name').value,
          email:document.getElementById('r-email').value,
          upi_id:document.getElementById('r-upi').value,
          password:document.getElementById('r-pw').value
        })
      });
      const data=await r.json();
      if(!r.ok)throw new Error(data.detail||'Registration failed');
      // localStorage.setItem('qp_token',data.token);  // Phase 5: Using HttpOnly Cookies
      localStorage.setItem('qp_upi',data.upi_id);
      ok.textContent='✅ Account created! Redirecting...';ok.className='ok show';
      setTimeout(()=>window.location.href='pay.html',1200);
    }catch(ex){
      err.textContent='❌ '+ex.message;err.className='err show';
      btn.disabled=false;btn.innerHTML='<span class="btn-glow"></span>⚛ Create Quantum Account';
    }
  }
  </script>
</body>
</html>
